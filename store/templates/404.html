{% extends "base.html" %}
{% load static %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 text-center">
      <img
        src="{% static 'image/logo.png' %}"
        alt="Bella-Store"
        style="max-width:120px;"
        class="mb-3"
      />

      <h1 class="display-4 font-weight-bold">404</h1>
      <p class="lead mb-4">
        Sorry, we can’t find that page.
      </p>

      <div class="d-flex justify-content-center gap-2">
        <a href="{% url 'home' %}" class="btn btn-warning mr-2">
          Back to Home
        </a>
        <a href="{% url 'contact' %}" class="btn btn-outline-dark">
          Contact Support
        </a>
      </div>

      <p class="text-muted small mt-4 mb-0">
        If you typed the address, check for typos. Or try searching from the homepage.
      </p>
    </div>
  </div>
</div>
{% endblock %}
